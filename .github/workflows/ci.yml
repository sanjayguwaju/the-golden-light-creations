name: CI Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # or 10, adjusting to match your engine (pnpm ^9 || ^10)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        # Passing dummy variables just in case Payload/Next.js requires them at build time
        env:
          PAYLOAD_SECRET: dummy-secret-for-build
          DATABASE_URL: mongodb://localhost:27017/dummy
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        run: pnpm run build
